name: Import website sources
on:
  push:
    paths: ['.github/workflows/import-source.yml', 'astra-web-source.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Expand the uploaded project source
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile('astra-web-source.zip') as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] not in ('website', 'README.md', '.gitignore'):
                      raise ValueError('Unexpected archive path')
              archive.extractall('.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website README.md .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete website source folders'
            git push
          fi
